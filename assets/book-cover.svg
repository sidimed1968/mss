<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 400">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f6c88"/>
      <stop offset="100%" style="stop-color:#16243a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0a51d"/>
      <stop offset="100%" style="stop-color:#d4940f"/>
    </linearGradient>
  </defs>
  
  <!-- Book cover background -->
  <rect width="280" height="400" rx="4" fill="url(#coverGrad)"/>
  
  <!-- Decorative border -->
  <rect x="12" y="12" width="256" height="376" rx="2" fill="none" stroke="#f0a51d" stroke-width="1" opacity="0.5"/>
  <rect x="18" y="18" width="244" height="364" rx="2" fill="none" stroke="#f0a51d" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Top decorative element -->
  <rect x="60" y="40" width="160" height="3" rx="1.5" fill="url(#goldGrad)"/>
  
  <!-- Publisher name -->
  <text x="140" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#9fb2c2" letter-spacing="0.15em">BUREAU HIKMA</text>
  
  <!-- Icon/Symbol -->
  <circle cx="140" cy="130" r="35" fill="none" stroke="#f0a51d" stroke-width="2"/>
  <circle cx="140" cy="130" r="25" fill="none" stroke="#f0a51d" stroke-width="1" opacity="0.5"/>
  <text x="140" y="138" text-anchor="middle" font-family="Arial" font-size="28" fill="#f0a51d">▯</text>
  
  <!-- Main title French -->
  <text x="140" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#ffffff" font-weight="bold">Communication</text>
  <text x="140" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#ffffff" font-weight="bold">de Sante</text>
  
  <!-- Subtitle -->
  <text x="140" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9fb2c2">Outil pour la Sante et le Developpement</text>
  
  <!-- Divider -->
  <rect x="100" y="280" width="80" height="1" fill="#f0a51d" opacity="0.6"/>
  
  <!-- Arabic title -->
  <text x="140" y="310" text-anchor="middle" font-family="Tahoma, Arial" font-size="16" fill="#ffffff" direction="rtl">الاتصال الصحي</text>
  <text x="140" y="335" text-anchor="middle" font-family="Tahoma, Arial" font-size="10" fill="#9fb2c2" direction="rtl">أداة للصحة والتنمية</text>
  
  <!-- Bottom decorative element -->
  <rect x="60" y="360" width="160" height="3" rx="1.5" fill="url(#goldGrad)"/>
  
  <!-- Spine effect -->
  <rect x="0" y="0" width="8" height="400" fill="rgba(0,0,0,0.2)"/>
</svg>
